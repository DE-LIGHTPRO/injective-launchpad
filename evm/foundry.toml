[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# The Rust implementation is the spec, and its arithmetic is exact. Any implicit
# truncation here is a silent divergence from it, so unchecked blocks are opt-in
# per expression and never file-wide.
via_ir = false

# Read access for the parity vectors only. Foundry sandboxes the filesystem by
# default, which is the right default: a test suite that can read anything can also
# read a keystore.
fs_permissions = [{ access = "read", path = "./test/vectors.json" }]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
injective = "https://sentry.evm-rpc.injective.network"
